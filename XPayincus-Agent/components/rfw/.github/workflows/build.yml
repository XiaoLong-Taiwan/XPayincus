name: Build and Release

on:
  push:
    tags:
      - 'v*'
  pull_request:
    branches: [ main ]

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - target: x86_64-unknown-linux-musl
            musl_target: x86_64-linux-musl
            arch: amd64
          - target: aarch64-unknown-linux-musl
            musl_target: aarch64-linux-musl
            arch: arm64

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Install musl tools
      run: |
        sudo apt-get update
        sudo apt-get install -y musl-tools

    - name: Install musl cross compiler
      if: matrix.target == 'aarch64-unknown-linux-musl'
      run: |
        sudo apt-get install -y gcc-aarch64-linux-gnu

    - name: Install Rust toolchains
      run: |
        rustup toolchain install stable
        rustup toolchain install nightly --component rust-src
        rustup target add --toolchain stable ${{ matrix.target }}

    - name: Install bpf-linker
      run: cargo install bpf-linker --locked

    - name: Build release binary
      run: cargo build --package rfw --release --target ${{ matrix.target }}
      env:
        CC: ${{ matrix.target == 'aarch64-unknown-linux-musl' && 'aarch64-linux-gnu-gcc' || 'musl-gcc' }}
        CARGO_TARGET_AARCH64_UNKNOWN_LINUX_MUSL_LINKER: aarch64-linux-gnu-gcc

    - name: Prepare binary
      run: |
        mkdir -p artifacts
        cp target/${{ matrix.target }}/release/rfw artifacts/xpayincus-rfw-${{ github.ref_name }}-linux-${{ matrix.arch }}
        chmod +x artifacts/xpayincus-rfw-${{ github.ref_name }}-linux-${{ matrix.arch }}

    - name: Upload artifacts
      uses: actions/upload-artifact@v4
      with:
        name: xpayincus-rfw-${{ github.ref_name }}-linux-${{ matrix.arch }}
        path: artifacts/xpayincus-rfw-${{ github.ref_name }}-linux-${{ matrix.arch }}

  release:
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Download all artifacts
      uses: actions/download-artifact@v4
      with:
        path: artifacts

    - name: Prepare release files
      run: |
        # 创建临时目录存放所有二进制文件
        mkdir -p release-files

        # 将所有二进制文件移到临时目录
        find artifacts -type f -name 'xpayincus-rfw-*-linux-*' -exec mv {} release-files/ \;

        # 删除旧的artifacts目录并用临时目录替换
        rm -rf artifacts
        mv release-files artifacts

        # 创建统一的checksums文件
        cd artifacts
        sha256sum xpayincus-rfw-*-linux-* > checksums.txt

    - name: Create Release
      uses: softprops/action-gh-release@v2
      with:
        files: |
          artifacts/xpayincus-rfw-*-linux-*
          artifacts/checksums.txt
        draft: false
        prerelease: false
        generate_release_notes: true
        body: |
          ## Installation

          Download the binary for your platform:

          ```bash
          # For x86_64 (Intel/AMD)
          wget https://github.com/${{ github.repository }}/releases/download/${{ github.ref_name }}/xpayincus-rfw-${{ github.ref_name }}-linux-amd64
          chmod +x xpayincus-rfw-${{ github.ref_name }}-linux-amd64
          sudo mv xpayincus-rfw-${{ github.ref_name }}-linux-amd64 /usr/local/bin/rfw

          # For ARM64 (Raspberry Pi, AWS Graviton, etc.)
          wget https://github.com/${{ github.repository }}/releases/download/${{ github.ref_name }}/xpayincus-rfw-${{ github.ref_name }}-linux-arm64
          chmod +x xpayincus-rfw-${{ github.ref_name }}-linux-arm64
          sudo mv xpayincus-rfw-${{ github.ref_name }}-linux-arm64 /usr/local/bin/rfw
          ```

          ## Usage

          ```bash
          # Basic usage - block all China inbound traffic
          sudo rfw --iface eth0 --block-cn-all

          # Block specific protocols from China
          sudo rfw --iface eth0 --block-cn-http --block-cn-socks5

          # Block email sending
          sudo rfw --iface eth0 --block-email
          ```

          ## Requirements

          - Linux kernel 5.15+ with XDP support
          - Root privileges to attach XDP programs
          - Network interface with XDP driver support

          ## Verify checksums

          ```bash
          sha256sum -c checksums.txt
          ```
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
