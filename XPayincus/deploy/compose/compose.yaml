name: incudal-panel

services:
  init:
    image: postgres:16-bookworm
    restart: 'no'
    network_mode: none
    entrypoint: [sh, -eu, -c]
    command:
      - |
        umask 077
        mkdir -p /var/lib/postgresql/data /deployment/certs /deployment/backups /deployment/config
        chown postgres:postgres /var/lib/postgresql/data
        chown 1000:1000 /deployment/certs /deployment/config
        chown 1000:1000 /deployment/backups
        chmod 700 /var/lib/postgresql/data /deployment/certs /deployment/backups /deployment/config /deployment/secrets
        for secret_name in postgres_password jwt_secret cookie_secret encryption_key admin_password; do
          test -f "/deployment/secrets/$$secret_name"
          test -s "/deployment/secrets/$$secret_name"
          chmod 600 "/deployment/secrets/$$secret_name"
        done
        chmod 600 /deployment/.env
    volumes:
      - ./data/postgres:/var/lib/postgresql/data
      - ./certs:/deployment/certs
      - ./backups:/deployment/backups
      - ./config:/deployment/config
      - type: bind
        source: ./secrets
        target: /deployment/secrets
        bind:
          create_host_path: false
      - type: bind
        source: ./.env
        target: /deployment/.env
        bind:
          create_host_path: false

  db:
    image: postgres:16-bookworm
    restart: unless-stopped
    environment:
      POSTGRES_DB: incudal
      POSTGRES_USER: incudal
      POSTGRES_PASSWORD_FILE: /run/secrets/postgres_password
      POSTGRES_INITDB_ARGS: --auth-host=scram-sha-256
    secrets:
      - postgres_password
    volumes:
      - ./data/postgres:/var/lib/postgresql/data
    depends_on:
      init:
        condition: service_completed_successfully
    networks:
      - database
    healthcheck:
      test: [CMD-SHELL, 'pg_isready -U incudal -d incudal']
      interval: 5s
      timeout: 5s
      retries: 30
    logging: &logging
      driver: json-file
      options:
        max-size: 10m
        max-file: '3'

  api:
    container_name: incudal-panel-api
    image: ghcr.io/xiaolong-taiwan/xpayincus-api:v1.0.12
    restart: unless-stopped
    init: true
    environment:
      NODE_ENV: production
      INCUDAL_CONTAINER_DEPLOYMENT: 'true'
      HOST: 0.0.0.0
      PORT: '3001'
      TRUST_PROXY: 'true'
      SERVE_STATIC_CLIENT: 'false'
      FRONTEND_URL: ${FRONTEND_URL:?Run panel.sh init first}
      ADMIN_FRONTEND_URL: ${ADMIN_FRONTEND_URL:?Run panel.sh init first}
      SITE_URL: ${FRONTEND_URL}
      PAYMENT_CALLBACK_BASE_URL: ${FRONTEND_URL}
      ADMIN_EMAIL: ${ADMIN_EMAIL:?Set ADMIN_EMAIL}
      COOKIE_SECURE: 'true'
      COOKIE_SAME_SITE: lax
      COOKIE_DOMAIN: ''
      PAYMENT_CALLBACK_IP_WHITELIST_REQUIRED: 'true'
      PAYMENT_CALLBACK_SKIP_IP_WHITELIST: 'false'
      DISABLE_REQUEST_LOG: 'true'
      INCUDAL_APP_DIR: /opt/incudal/app
      INCUDAL_INSTALL_DIR: /opt/incudal
      INSTALL_DIR: /opt/incudal
      PANEL_CRT_PATH: /opt/incudal/server/certs/client.crt
      PANEL_KEY_PATH: /opt/incudal/server/certs/client.key
      INCUDAL_RELEASE_REPOSITORY: ${INCUDAL_RELEASE_REPOSITORY:-}
      INCUDAL_AGENT_RELEASE_REPOSITORY: ${INCUDAL_AGENT_RELEASE_REPOSITORY:-}
      INCUDAL_AGENT_CACHE_DIR: /opt/incudal/config/agent-cache
      INCUDAL_AGENT_STATE_DIR: /opt/incudal/config/agent-state
    secrets:
      - jwt_secret
      - cookie_secret
      - encryption_key
      - admin_password
      - postgres_password
    volumes:
      - ./certs:/opt/incudal/server/certs
      - ./config:/opt/incudal/config
      - ./backups:/opt/incudal/backups
      - type: bind
        source: ./.env
        target: /deployment/.env
        read_only: true
        bind:
          create_host_path: false
    depends_on:
      init:
        condition: service_completed_successfully
      db:
        condition: service_healthy
    networks:
      - database
      - panel
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - NET_RAW
    sysctls:
      net.ipv4.ping_group_range: '1000 1000'
    healthcheck:
      test: [CMD, node, -e, "fetch('http://127.0.0.1:3001/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 10s
      timeout: 5s
      start_period: 120s
      retries: 12
    stop_grace_period: 45s
    logging: *logging

  user:
    image: ghcr.io/xiaolong-taiwan/xpayincus-panel-web:v1.0.12
    restart: unless-stopped
    environment:
      PANEL_ENTRY: user
      FRONTEND_URL: ${FRONTEND_URL}
      ADMIN_FRONTEND_URL: ${ADMIN_FRONTEND_URL}
    ports:
      - '127.0.0.1:${USER_PORT:-3000}:80'
    depends_on:
      api:
        condition: service_healthy
    networks:
      - panel
    healthcheck: &web-healthcheck
      test: [CMD, wget, -q, --spider, http://127.0.0.1/index.html]
      interval: 10s
      timeout: 5s
      start_period: 10s
      retries: 6
    logging: *logging

  admin:
    image: ghcr.io/xiaolong-taiwan/xpayincus-panel-web:v1.0.12
    restart: unless-stopped
    environment:
      PANEL_ENTRY: admin
      FRONTEND_URL: ${FRONTEND_URL}
      ADMIN_FRONTEND_URL: ${ADMIN_FRONTEND_URL}
    ports:
      - '127.0.0.1:${ADMIN_PORT:-3001}:80'
    depends_on:
      api:
        condition: service_healthy
    networks:
      - panel
    healthcheck: *web-healthcheck
    logging: *logging

  nginx:
    image: nginx:1.28-alpine
    profiles: [nginx]
    restart: unless-stopped
    entrypoint: [sh, /origin-entrypoint.sh]
    environment:
      FRONTEND_URL: ${FRONTEND_URL}
      ADMIN_FRONTEND_URL: ${ADMIN_FRONTEND_URL}
      NGINX_ENVSUBST_FILTER: '^(FRONTEND_HOST|ADMIN_FRONTEND_HOST)$$'
    ports:
      - '${HTTPS_PORT:-443}:443'
    volumes:
      - ./origin-entrypoint.sh:/origin-entrypoint.sh:ro
      - ./edge-nginx.conf.template:/etc/nginx/templates/default.conf.template:ro
      - type: bind
        source: ./tls
        target: /etc/nginx/tls
        read_only: true
        bind:
          create_host_path: false
    depends_on:
      user:
        condition: service_healthy
      admin:
        condition: service_healthy
    networks:
      - panel
    logging: *logging

  tunnel-origin:
    image: nginx:1.28-alpine
    profiles: [cloudflare]
    restart: unless-stopped
    entrypoint: [sh, /origin-entrypoint.sh]
    environment:
      FRONTEND_URL: ${FRONTEND_URL}
      ADMIN_FRONTEND_URL: ${ADMIN_FRONTEND_URL}
      NGINX_ENVSUBST_FILTER: '^(FRONTEND_HOST|ADMIN_FRONTEND_HOST)$$'
    volumes:
      - ./origin-entrypoint.sh:/origin-entrypoint.sh:ro
      - ./tunnel-nginx.conf.template:/etc/nginx/templates/default.conf.template:ro
    depends_on:
      user:
        condition: service_healthy
      admin:
        condition: service_healthy
    networks:
      - panel
      - tunnel
    logging: *logging

  cloudflared:
    image: cloudflare/cloudflared:latest
    profiles: [cloudflare]
    restart: unless-stopped
    user: '0:0'
    command: [tunnel, --no-autoupdate, run, --token-file, /run/secrets/cloudflare_tunnel_token]
    secrets:
      - cloudflare_tunnel_token
    depends_on:
      tunnel-origin:
        condition: service_started
    networks:
      - tunnel
      - egress
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    read_only: true
    logging: *logging

networks:
  database:
    internal: true
  panel:
  tunnel:
    internal: true
  egress:

secrets:
  cloudflare_tunnel_token:
    file: ./secrets/cloudflare_tunnel_token
  postgres_password:
    file: ./secrets/postgres_password
  jwt_secret:
    file: ./secrets/jwt_secret
  cookie_secret:
    file: ./secrets/cookie_secret
  encryption_key:
    file: ./secrets/encryption_key
  admin_password:
    file: ./secrets/admin_password
