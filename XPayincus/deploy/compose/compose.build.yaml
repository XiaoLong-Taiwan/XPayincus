services:
  api:
    build:
      context: ${BUILD_CONTEXT:-../..}
      dockerfile: deploy/compose/Dockerfile
      target: api
      labels:
        org.opencontainers.image.version: v1.0.7
  user:
    build: &web-build
      context: ${BUILD_CONTEXT:-../..}
      dockerfile: deploy/compose/Dockerfile
      target: web
      labels:
        org.opencontainers.image.version: v1.0.7
  admin:
    build: *web-build
