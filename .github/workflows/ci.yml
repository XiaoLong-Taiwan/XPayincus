name: Unified CI

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

jobs:
  version:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validate versions and Agent component source layout
        run: node scripts/release-contract.mjs
      - name: Test Docker publication guards
        run: node --test scripts/test-docker-release.mjs
      - name: Test Compose release and bootstrap contracts
        run: |
          node scripts/test-compose-release.mjs
          python3 scripts/test-compose-bundle.py
          python3 scripts/test-compose-bootstrap.py
          python3 scripts/test-compose-update.py
          python3 scripts/test-compose-operations.py
          python3 scripts/test-compose-wizard.py
          python3 scripts/test-compose-menu.py
          python3 scripts/test-manage-menu.py
          python3 scripts/test-dashboard-menu.py
          python3 scripts/test-agent-installer.py
          python3 scripts/test-panel-trust-diagnostics.py
          python3 scripts/test-host-install-trust.py
          python3 scripts/test-host-shortcuts.py
          python3 XPayincus-Agent/components/zfs/test-debian13-modules.py
  docs:
    needs: version
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    defaults:
      run:
        working-directory: XPayincus
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: pnpm/action-setup@v4
        with:
          version: 9.14.2
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: pnpm
          cache-dependency-path: XPayincus/docs-site/pnpm-lock.yaml
      - name: Test deployment documentation guard contracts
        run: node --test docs-site/scripts/test-deployment-docs.mjs
      - name: Check deployment documentation
        run: pnpm --dir docs-site --ignore-workspace check:deployment
      - name: Install docs dependencies
        run: pnpm --dir docs-site install --ignore-workspace --frozen-lockfile
      - name: Build docs
        run: pnpm --dir docs-site --ignore-workspace build
      - name: Verify docs output
        run: test -s docs-site/docs/.vitepress/dist/index.html
  panel:
    needs: version
    runs-on: ubuntu-24.04
    env:
      DATABASE_URL: postgresql://test:test@127.0.0.1:5432/xpayincus_test
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: test
          POSTGRES_PASSWORD: test
          POSTGRES_DB: xpayincus_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U test -d xpayincus_test"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5
    defaults:
      run:
        working-directory: XPayincus
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: pnpm/action-setup@v4
        with:
          version: 9.14.2
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: pnpm
          cache-dependency-path: XPayincus/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile --ignore-scripts
      - run: pnpm rebuild esbuild
      - run: pnpm --filter server exec prisma generate
      - run: pnpm --filter server test:proxy-sites-removal-guards
      - name: Test Agent tunnel transport
        run: pnpm --filter server test:agent-tunnel
      - name: Test Agent tunnel authentication
        run: pnpm --filter server test:agent-tunnel-auth
      - name: Test Agent tunnel streaming
        run: pnpm --filter server test:agent-tunnel-stream
      - name: Test Agent integration guards
        run: pnpm --filter server test:agent-integration-guards
      - name: Test host Agent onboarding guards
        run: pnpm --filter server test:host-agent-onboarding-guards
      - name: Test host port management guards
        run: pnpm --filter server test:host-port-management-guards
      - run: pnpm --filter server test:hosting-access-application-guards
      - run: pnpm --filter client test:instance-monitoring-guards
      - run: pnpm --filter server test:agent-monitoring-stream-guards
      - name: Apply PostgreSQL migrations to test database
        run: pnpm --filter server exec prisma migrate deploy
      - run: pnpm --filter server test:registration-ssh-key-guards
      - run: pnpm --filter server test:ssh-key-route-id-guards
      - run: pnpm test:core
      - run: pnpm --filter server test:storage-pool-update
      - run: pnpm --filter client test:host-install-ui-guards
      - run: pnpm --filter server test:panel-backup-guards
      - run: pnpm --filter server test:update-manifest-contract
      - run: pnpm --filter server test:native-panel-download
      - name: Verify PostgreSQL migrations on empty and previous databases
        working-directory: .
        run: bash scripts/test-postgres-migrations.sh
      - run: bash scripts/test-install-panel-guards.sh
      - run: pnpm build
  agent:
    needs: version
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-go@v5
        with:
          go-version: '1.22.x'
          cache: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: go test ./...
        working-directory: XPayincus-Agent
      - run: bash scripts/build-agent-release.sh
  host-components:
    needs: version
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check host component shell syntax
        run: |
          bash -n scripts/build-rfw-release.sh
          bash -n scripts/package-zfs-source.sh
          bash -n scripts/rfw-manage.sh
          bash -n scripts/zfs-manage.sh
          bash -n XPayincus-Agent/components/install-host-tools.sh
          bash -n XPayincus-Agent/components/zfs/zfs-builder.sh
      - name: Test atomic host status snapshots
        run: python3 scripts/test-host-snapshot.py
      - name: Package Agent ZFS builder source
        run: bash scripts/package-zfs-source.sh
  compose:
    needs: version
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Validate deployment scripts and configuration
        shell: bash
        run: |
          bash -n XPayincus/deploy/compose/panel.sh
          sh -n XPayincus/deploy/compose/api-entrypoint.sh
          sh -n XPayincus/deploy/compose/web-entrypoint.sh
          deployment="$(mktemp -d "$RUNNER_TEMP/panel.XXXXXXXX")"
          bash XPayincus/deploy/compose/panel.sh install "$deployment"
          bash "$deployment/panel.sh" init https://pay.example.com https://admin.example.com admin@example.com
          docker compose --project-directory "$deployment" --env-file "$deployment/.env" -f "$deployment/compose.yaml" config --quiet
      - name: Build Compose images
        working-directory: XPayincus
        run: |
          bash deploy/compose/panel.sh init https://pay.example.com https://admin.example.com admin@example.com
          docker compose --env-file deploy/compose/.env -f deploy/compose/compose.yaml -f deploy/compose/compose.build.yaml build
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Package committed Dashboard sources
        run: bash scripts/package-dashboard-release.sh
