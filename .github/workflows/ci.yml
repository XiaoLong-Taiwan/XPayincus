name: Unified CI

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

jobs:
  version:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validate versions and Agent component source layout
        run: node scripts/release-contract.mjs
      - name: Test Docker publication guards
        run: node --test scripts/test-docker-release.mjs
      - name: Test Compose release and bootstrap contracts
        run: |
          node scripts/test-compose-release.mjs
          python3 scripts/test-compose-bundle.py
          python3 scripts/test-compose-bootstrap.py
          python3 scripts/test-compose-update.py
          python3 scripts/test-compose-operations.py
          python3 scripts/test-compose-wizard.py
          python3 scripts/test-compose-menu.py
          python3 scripts/test-manage-menu.py
          python3 scripts/test-dashboard-menu.py
          python3 scripts/test-agent-installer.py
          python3 scripts/test-host-shortcuts.py
          python3 XPayincus-Agent/components/zfs/test-debian13-modules.py
  panel:
    needs: version
    runs-on: ubuntu-24.04
    env:
      DATABASE_URL: postgresql://test:test@127.0.0.1:5432/xpayincus_test
    defaults:
      run:
        working-directory: XPayincus
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@v4
        with:
          version: 9.14.2
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: pnpm
          cache-dependency-path: XPayincus/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile --ignore-scripts
      - run: pnpm rebuild esbuild
      - run: pnpm --filter server exec prisma generate
      - run: pnpm test
      - run: pnpm --filter server test:storage-pool-update
      - run: pnpm --filter client test:host-install-ui-guards
      - run: pnpm --filter server test:panel-backup-guards
      - run: pnpm --filter server test:update-manifest-contract
      - run: pnpm --filter server test:native-panel-download
      - run: bash scripts/test-install-panel-guards.sh
      - run: pnpm build
  agent:
    needs: version
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-go@v5
        with:
          go-version: '1.22.x'
          cache: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: go test ./...
        working-directory: XPayincus-Agent
      - run: bash scripts/build-agent-release.sh
  host-components:
    needs: version
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check host component shell syntax
        run: |
          bash -n scripts/build-rfw-release.sh
          bash -n scripts/package-zfs-source.sh
          bash -n scripts/rfw-manage.sh
          bash -n scripts/zfs-manage.sh
          bash -n XPayincus-Agent/components/install-host-tools.sh
          bash -n XPayincus-Agent/components/zfs/zfs-builder.sh
      - name: Test atomic host status snapshots
        run: python3 scripts/test-host-snapshot.py
      - name: Package Agent ZFS builder source
        run: bash scripts/package-zfs-source.sh
  compose:
    needs: version
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Validate deployment scripts and configuration
        shell: bash
        run: |
          bash -n XPayincus/deploy/compose/panel.sh
          sh -n XPayincus/deploy/compose/api-entrypoint.sh
          sh -n XPayincus/deploy/compose/web-entrypoint.sh
          deployment="$(mktemp -d "$RUNNER_TEMP/panel.XXXXXXXX")"
          bash XPayincus/deploy/compose/panel.sh install "$deployment"
          bash "$deployment/panel.sh" init https://pay.example.com https://admin.example.com admin@example.com
          docker compose --project-directory "$deployment" --env-file "$deployment/.env" -f "$deployment/compose.yaml" config --quiet
      - name: Build Compose images
        working-directory: XPayincus
        run: |
          bash deploy/compose/panel.sh init https://pay.example.com https://admin.example.com admin@example.com
          docker compose --env-file deploy/compose/.env -f deploy/compose/compose.yaml -f deploy/compose/compose.build.yaml build
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Package committed Dashboard sources
        run: bash scripts/package-dashboard-release.sh
