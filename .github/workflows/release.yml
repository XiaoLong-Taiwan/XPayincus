name: Unified Release Artifacts

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    uses: ./.github/workflows/ci.yml
  version:
    needs: validate
    runs-on: ubuntu-24.04
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - id: version
        shell: bash
        run: |
          source scripts/release-common.sh
          if [[ "$GITHUB_REF_TYPE" == tag && "$GITHUB_REF_NAME" != "$VERSION" ]]; then
            printf 'Tag must match root VERSION\n' >&2
            exit 1
          fi
          printf 'version=%s\n' "$VERSION" >> "$GITHUB_OUTPUT"
  docker:
    needs: version
    permissions:
      contents: read
      packages: write
    uses: ./.github/workflows/docker.yml
  server:
    needs: version
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-24.04
          - arch: arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@v4
        with:
          version: 9.14.2
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: pnpm
          cache-dependency-path: XPayincus/pnpm-lock.yaml
      - run: bash scripts/build-server-release.sh
        env:
          SOURCE_COMMIT: ${{ github.sha }}
      - uses: actions/upload-artifact@v4
        with:
          name: unified-server-${{ matrix.arch }}
          path: dist/unified/*.tar.gz
          if-no-files-found: error
  agent:
    needs: version
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-go@v5
        with:
          go-version: '1.22.x'
          cache: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: bash scripts/build-agent-release.sh
      - uses: actions/upload-artifact@v4
        with:
          name: unified-agent
          path: dist/unified/*
          if-no-files-found: error
  rfw:
    needs: version
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            target: x86_64-unknown-linux-musl
            runner: ubuntu-24.04
          - arch: arm64
            target: aarch64-unknown-linux-musl
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: sudo apt-get update && sudo apt-get install -y musl-tools clang llvm
      - run: |
          rustup toolchain install stable --profile minimal
          rustup default stable
          rustup toolchain install nightly --profile minimal --component rust-src
          rustup target add "$RUST_TARGET"
          curl --fail --location --retry 3 "https://github.com/aya-rs/bpf-linker/releases/download/v0.13.0/bpf-linker-${RUST_TARGET}.tar.zst" -o "$RUNNER_TEMP/bpf-linker.tar.zst"
          mkdir -p "$RUNNER_TEMP/bpf-linker"
          tar --zstd -xf "$RUNNER_TEMP/bpf-linker.tar.zst" -C "$RUNNER_TEMP/bpf-linker"
          install -m 0755 "$RUNNER_TEMP/bpf-linker/bpf-linker" "$HOME/.cargo/bin/bpf-linker"
          bpf-linker --version
        env:
          RUST_TARGET: ${{ matrix.target }}
      - name: Build Agent RFW host component
        run: bash scripts/build-rfw-release.sh
      - uses: actions/upload-artifact@v4
        with:
          name: unified-rfw-${{ matrix.arch }}
          path: dist/unified/*
          if-no-files-found: error
  assemble:
    needs: [version, server, agent, rfw, docker]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/download-artifact@v4
        with:
          pattern: unified-*
          path: dist/incoming
          merge-multiple: false
      - run: node scripts/collect-release-artifacts.mjs dist/incoming dist/unified
      - name: Package Agent ZFS host component source
        run: bash scripts/package-zfs-source.sh
      - run: bash scripts/package-dashboard-release.sh
      - run: node scripts/generate-release-manifests.mjs dist/unified
      - uses: actions/upload-artifact@v4
        with:
          name: xpayincus-unified-${{ needs.version.outputs.version }}
          path: dist/unified/*
          if-no-files-found: error
          retention-days: 30
  publish:
    if: github.ref_type == 'tag'
    needs: [version, assemble, docker]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: xpayincus-unified-${{ needs.version.outputs.version }}
          path: release-assets
      - name: Verify and publish release assets
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          VERSION: ${{ needs.version.outputs.version }}
        run: |
          cd release-assets
          test "$(find . -maxdepth 1 -type f | wc -l)" -eq 28
          sha256sum --check SHA256SUMS
          gh release create "$VERSION" ./* --verify-tag --title "XPayincus $VERSION" --generate-notes --latest
