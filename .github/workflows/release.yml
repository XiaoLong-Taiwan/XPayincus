name: Unified Release Artifacts

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  version:
    runs-on: ubuntu-24.04
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - id: version
        shell: bash
        run: |
          source scripts/release-common.sh
          if [[ "$GITHUB_REF_TYPE" == tag && "$GITHUB_REF_NAME" != "$VERSION" ]]; then
            printf 'Tag must match root VERSION\n' >&2
            exit 1
          fi
          printf 'version=%s\n' "$VERSION" >> "$GITHUB_OUTPUT"
  server:
    needs: version
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-24.04
          - arch: arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@v4
        with:
          version: 9.14.2
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: pnpm
          cache-dependency-path: XPayincus/pnpm-lock.yaml
      - run: bash scripts/build-server-release.sh
        env:
          SOURCE_COMMIT: ${{ github.sha }}
      - uses: actions/upload-artifact@v4
        with:
          name: unified-server-${{ matrix.arch }}
          path: dist/unified/*.tar.gz
          if-no-files-found: error
  agent:
    needs: version
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-go@v5
        with:
          go-version: '1.22.x'
          cache: false
      - run: bash scripts/build-agent-release.sh
      - uses: actions/upload-artifact@v4
        with:
          name: unified-agent
          path: dist/unified/*
          if-no-files-found: error
  rfw:
    needs: version
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            target: x86_64-unknown-linux-musl
            runner: ubuntu-24.04
          - arch: arm64
            target: aarch64-unknown-linux-musl
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - run: sudo apt-get update && sudo apt-get install -y musl-tools clang llvm
      - run: |
          rustup toolchain install stable --profile minimal
          rustup default stable
          rustup toolchain install nightly --profile minimal --component rust-src
          rustup target add "$RUST_TARGET"
          cargo install bpf-linker --locked
        env:
          RUST_TARGET: ${{ matrix.target }}
      - run: bash scripts/build-rfw-release.sh
      - uses: actions/upload-artifact@v4
        with:
          name: unified-rfw-${{ matrix.arch }}
          path: dist/unified/*
          if-no-files-found: error
  assemble:
    needs: [version, server, agent, rfw]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/download-artifact@v4
        with:
          pattern: unified-*
          path: dist/unified
          merge-multiple: true
      - run: bash scripts/package-zfs-source.sh
      - run: bash scripts/package-dashboard-release.sh
      - run: node scripts/generate-release-manifests.mjs dist/unified
      - uses: actions/upload-artifact@v4
        with:
          name: xpayincus-unified-${{ needs.version.outputs.version }}
          path: dist/unified/*
          if-no-files-found: error
          retention-days: 30
